    }

    /* YouTube */
    .youtube-section {
      position: relative;
      background:
        linear-gradient(90deg, rgba(0, 0, 0, 0.88), rgba(0, 0, 0, 0.78)),
        url('https://images.unsplash.com/photo-1585747860715-2ba37e788b70?auto=format&fit=crop&w=1800&q=85') center/cover fixed;
      overflow: hidden;
    }

    .youtube-section::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 70% 30%, rgba(255, 0, 0, 0.22), transparent 35%);
    }

    .youtube-grid {
      position: relative;
      z-index: 2;
      display: grid;
      grid-template-columns: 0.95fr 1.05fr;
      gap: 56px;
      align-items: center;
    }

    .youtube-preview {
      border-radius: 34px;
      overflow: hidden;
      background: #111;
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: var(--shadow);
      position: relative;
    }

    .youtube-preview img {
      width: 100%;
      height: 420px;
      object-fit: cover;
      opacity: 0.82;
    }

    .play-button {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
    }

    .play-button span {
      width: 98px;
      height: 98px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: #ff0000;
      color: #fff;
      font-size: 42px;
      box-shadow: 0 20px 60px rgba(255, 0, 0, 0.48);
      transition: 0.35s ease;
    }

    .youtube-preview:hover .play-button span {
      transform: scale(1.08);
    }

    .youtube-content h2 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(34px, 5vw, 62px);
      line-height: 1.08;
      margin-bottom: 20px;
    }

    .youtube-content p {
      color: #e1e1e1;
      line-height: 1.85;
      font-size: 17px;
      margin-bottom: 26px;
    }

    .youtube-features {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 32px;
    }

    .youtube-features span {
      padding: 10px 16px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.09);
      border: 1px solid rgba(255, 255, 255, 0.11);
      color: var(--gold-light);
      font-size: 13px;
      font-weight: 800;
    }

    /* =========================
       PREMIUM SOCIAL SECTION
    ========================= */
    .social-section {
      background:
        radial-gradient(circle at top left, rgba(198, 161, 91, 0.14), transparent 34%),
        radial-gradient(circle at bottom right, rgba(107, 31, 31, 0.16), transparent 34%),
        linear-gradient(135deg, #0b0908 0%, #15110f 50%, #0b0908 100%);
    }

    .social-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
    }

    .social-box {
      position: relative;
      min-height: 285px;
      padding: 34px 28px;
      border-radius: 28px;
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.075), rgba(255, 255, 255, 0.035));
      border: 1px solid rgba(198, 161, 91, 0.18);
      box-shadow: 0 22px 60px rgba(0, 0, 0, 0.34);
      overflow: hidden;
      transition: 0.35s ease;
      backdrop-filter: blur(14px);
    }

    .social-box::before {
      content: "";
      position: absolute;
      width: 190px;
      height: 190px;
      border-radius: 50%;
      top: -80px;
      right: -80px;
      opacity: 0.18;
      transition: 0.35s ease;
    }

    .social-box::after {
      content: "";
      position: absolute;
      inset: 1px;
      border-radius: 27px;
      background: linear-gradient(180deg, rgba(255,255,255,0.06), transparent);
      pointer-events: none;
    }

    .social-box:hover {
      transform: translateY(-10px);
      border-color: rgba(242, 208, 139, 0.45);
      box-shadow: 0 28px 72px rgba(0, 0, 0, 0.42);
    }

    .social-box:hover::before {
      transform: scale(1.32);
      opacity: 0.28;
    }

    .social-icon {
      width: 78px;
      height: 78px;
      border-radius: 24px;
      display: grid;
      place-items: center;
      background: rgba(255, 255, 255, 0.09);
      border: 1px solid rgba(255, 255, 255, 0.12);
      font-size: 42px;
      margin-bottom: 24px;
      position: relative;
      z-index: 2;
    }

    .social-box h3,
    .social-box p,
    .social-box span {
      position: relative;
      z-index: 2;
    }

    .social-box h3 {
      font-size: 25px;
      margin-bottom: 12px;
      color: #ffffff;
    }

    .social-box p {
      color: #d7d0c4;
      line-height: 1.75;
      font-size: 15px;
      margin-bottom: 22px;
    }

    .social-box span {
      color: var(--gold-light);
      font-weight: 900;
    }

    .youtube-box .social-icon { color: #ff0000; }
    .instagram-box .social-icon { color: #e4405f; }
    .facebook-box .social-icon { color: #1877f2; }
    .whatsapp-box .social-icon { color: #25d366; }
    .location-box .social-icon { color: var(--gold-light); }
    .call-box .social-icon { color: #00e676; }

    .youtube-box::before { background: #ff0000; }
    .instagram-box::before { background: linear-gradient(135deg, #f58529, #dd2a7b, #8134af); }
    .facebook-box::before { background: #1877f2; }
    .whatsapp-box::before { background: #25d366; }
    .location-box::before { background: var(--gold-light); }
    .call-box::before { background: #00e676; }

    /* Testimonials */
    .testimonials {
      background: linear-gradient(135deg, #171310, #0b0908);
    }

    .reviews-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
    }

    .review-card {
      padding: 32px;
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: var(--shadow);
    }

    .stars {
      color: var(--gold-light);
      margin-bottom: 18px;

    }

    .review-card p {

      line-height: 1.8;
      font-size: 15px;
      margin-bottom: 24px;
    }

    .review-user {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .review-user span {
      width: 46px;
      height: 46px;
      border-radius: 50%;

      place-items: center;
      background: var(--gold-light);

      font-weight: 900;
    }

    .review-user strong {

    }

    .review-user small {

    /* Payment */
    .payment {
      background:
        radial-gradient(circle at top left, rgba(212, 175, 55, 0.13), transparent 34%),
        radial-gradient(circle at bottom right, rgba(37, 211, 102, 0.12), transparent 34%),

    .payment-grid {

      grid-template-columns: 0.95fr 1.05fr;

    }

    .payment-info,
    .payment-card {

    .payment-list {
      display: grid;

    }

    .payment-list div {

    }

    .payment-list i {
      width: 42px;

      border-radius: 14px;

    }

    .payment-list strong {
      display: block;
      margin-bottom: 4px;
      color: #ffffff;
    }

    .payment-list p {
      color: var(--muted);
      line-height: 1.65;
      font-size: 15px;
      margin: 0;
    }

    .upi-id-box {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
      padding: 18px 20px;
      border-radius: 22px;
      background: rgba(212, 175, 55, 0.12);
      border: 1px solid rgba(212, 175, 55, 0.32);
      margin-bottom: 22px;
    }

    .upi-id-box span {
      color: #d7d7d7;
      font-size: 13px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.7px;
    }

    .upi-id-box strong {
      color: var(--gold-light);
      font-size: 22px;
      font-weight: 900;
      word-break: break-word;
    }

    .payment-card {
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .payment-card::before {
      content: "";
      position: absolute;
      width: 260px;
      height: 260px;
      border-radius: 50%;
      background: rgba(212, 175, 55, 0.14);
      top: -110px;
      right: -100px;
      filter: blur(10px);
    }

    .qr-frame {
      position: relative;
      z-index: 2;
      max-width: 390px;
      margin: 0 auto 26px;
      padding: 16px;
      border-radius: 30px;
      background: #ffffff;
      box-shadow: 0 24px 65px rgba(0, 0, 0, 0.42);
    }

    .qr-frame img {
      width: 100%;
      border-radius: 22px;
      object-fit: contain;
    }

    .payment-card h3 {
      position: relative;
      z-index: 2;
      font-size: 28px;
      margin-bottom: 10px;
    }

    .payment-card p {
      position: relative;
      z-index: 2;
      color: var(--muted);
      line-height: 1.7;
      max-width: 500px;
      margin: 0 auto 22px;
    }

    .payment-apps {
      position: relative;
      z-index: 2;
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 26px;
    }

    .payment-apps span {
      padding: 9px 14px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #ffffff;
      font-size: 13px;
      font-weight: 800;
    }

    .payment-actions {
      position: relative;
      z-index: 2;
      display: flex;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    .btn-upi {
      background: linear-gradient(135deg, #25d366, #128c7e);
      color: #ffffff;
      box-shadow: 0 18px 42px rgba(37, 211, 102, 0.22);
    }

    /* =========================
       PREMIUM CONTACT SECTION
    ========================= */
    .contact {
      background:
        radial-gradient(circle at top right, rgba(198, 161, 91, 0.12), transparent 34%),
        radial-gradient(circle at bottom left, rgba(107, 31, 31, 0.11), transparent 34%),
        linear-gradient(180deg, #0b0908 0%, #15110f 100%);
    }

    .contact-card,
    .map-card {
      padding: 36px;
      border-radius: 32px;
      background: linear-gradient(145deg, rgba(255,255,255,0.075), rgba(255,255,255,0.035));
      border: 1px solid rgba(198, 161, 91, 0.16);
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(14px);
    }

    .contact-item {
      display: flex;
      align-items: flex-start;
      gap: 15px;
      padding: 18px;
      border-radius: 22px;
      background: rgba(255, 255, 255, 0.055);
      border: 1px solid rgba(198, 161, 91, 0.12);
      transition: 0.3s ease;
    }

    .contact-item:hover {
      background: rgba(198, 161, 91, 0.09);
      border-color: rgba(198, 161, 91, 0.28);
      transform: translateY(-3px);
    }

    .contact-item i {
      width: 46px;
      height: 46px;
      border-radius: 16px;
      display: grid;
      place-items: center;
      background: rgba(198, 161, 91, 0.13);
      color: var(--gold-light);
      flex: 0 0 46px;
    }

    .contact-item strong {
      display: block;
      margin-bottom: 5px;
      color: #ffffff;
    }

    .contact-item p,
    .contact-item a {
      color: #d7d0c4;
      line-height: 1.6;
      font-size: 15px;
    }

    .map-card iframe {
      width: 100%;
      height: 100%;
      min-height: 460px;
      border: 0;
      border-radius: 24px;
      filter: grayscale(0.08) contrast(1.06);
    }

    /* Footer */
    footer {
      background: #070605;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding: 65px 0 24px;
    }

    .footer-grid {
      display: grid;
      grid-template-columns: 1.3fr 0.8fr 0.8fr 1fr;
      gap: 36px;
      margin-bottom: 45px;
    }

    .footer-logo {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 18px;
    }

    .footer-logo .brand-logo {
      width: 52px;
      height: 52px;
    }

    .footer-about p {
      color: var(--muted);
      line-height: 1.8;
      font-size: 15px;
      margin-bottom: 22px;
    }

    .footer-social {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .footer-social a {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: #fff;
      transition: 0.3s ease;
    }

    .footer-social a:hover {
      transform: translateY(-4px);
    }

    .footer-social .yt { background: #ff0000; }
    .footer-social .ig { background: linear-gradient(135deg, #f58529, #dd2a7b, #8134af); }
    .footer-social .fb { background: #1877f2; }
    .footer-social .wa { background: #25d366; }

    .footer-col h3 {
      font-size: 18px;
      margin-bottom: 20px;
      color: var(--gold-light);
    }

    .footer-col ul {
      list-style: none;
      display: grid;
      gap: 12px;
    }

    .footer-col a,
    .footer-col li {
      color: var(--muted);
      font-size: 15px;
      line-height: 1.6;
      transition: 0.3s ease;
    }

    .footer-col a:hover {
      color: var(--gold-light);
      padding-left: 4px;
    }

    .copyright {
      padding-top: 22px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      color: #a8a8a8;
      font-size: 14px;
      display: flex;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    /* Floating Buttons */
    .floating-actions {
      position: fixed;
      right: 22px;
      bottom: 22px;
      z-index: 999;
      display: grid;
      gap: 12px;
    }

    .floating-actions a {
      width: 56px;
      height: 56px;
      min-width: 44px;
      min-height: 44px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: #fff;
      font-size: 23px;
      box-shadow: 0 14px 35px rgba(0, 0, 0, 0.35);
      transition: 0.3s ease;
    }

    .floating-actions a:hover {
      transform: translateY(-4px) scale(1.04);
    }

    .float-whatsapp { background: var(--whatsapp); }
    .float-call { background: var(--gold); color: #111 !important; }

    .home-service-page {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .form-wrapper {
      width: 100%;
      max-width: 500px;
      background: var(--card);
      padding: 40px;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border: 1px solid rgba(198, 161, 91, 0.1);
    }

    .form-header { margin-bottom: 30px; text-align: center; }
    .form-title { margin-bottom: 10px; font-size: clamp(1.5rem, 1vw + 1.2rem, 1.75rem); }
    .form-intro { font-size: 0.875rem; opacity: 0.8; margin-bottom: 15px; }
    .service-badge {
      display: none;
      background: rgba(198, 161, 91, 0.15);
      color: var(--gold-light);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.875rem;
      font-weight: 600;
      border: 1px solid rgba(198, 161, 91, 0.3);
    }
    .service-badge i { margin-right: 5px; }
    .booking-form { width: 100%; }
    .form-group { margin-bottom: 20px; }
    .form-group:last-of-type { margin-bottom: 30px; }
    .form-label {
      display: block;
      margin-bottom: 8px;
      color: var(--gold-light);
      font-weight: 500;
    }
    .form-input {
      width: 100%;
      background: var(--dark);
      border: 1px solid rgba(198, 161, 91, 0.2);
      padding: 15px;
      color: var(--white);
      border-radius: 8px;
      font-family: inherit;
      font-size: 0.9375rem;
      outline: none;
    }
    .form-input.textarea { resize: vertical; }
    .payment-label { margin-bottom: 12px; }
    .payment-options { display: flex; gap: 20px; flex-wrap: wrap; }
    .payment-option {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      color: var(--white);
      min-height: 44px;
    }
    .payment-option input { accent-color: var(--gold); }
    .submit-button {
      width: 100%;
      padding: 15px;
      font-size: 1rem;
      border: none;
      border-radius: 8px;
      background: var(--gold);
      color: var(--black);
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .form-back { text-align: center; margin-top: 20px; }
    .form-back a { color: var(--muted); font-size: 0.875rem; display: inline-flex; align-items: center; min-height: 44px; }

    body { min-width: 0; }
    button, a, input, textarea { -webkit-tap-highlight-color: transparent; }
    a:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible {
      outline: 3px solid var(--gold-light);
      outline-offset: 3px;
    }
    .form-input { min-height: 48px; }
    .form-input::placeholder { color: #a9a095; opacity: 1; }
    .form-input:focus { border-color: var(--gold-light); box-shadow: 0 0 0 3px rgba(242, 208, 139, 0.14); }
    .submit-button:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 12px 28px rgba(198, 161, 91, 0.25); }
    .submit-button:disabled { cursor: wait; opacity: 0.72; }

    @media (max-width: 767px) {
      .home-service-page { align-items: flex-start; padding: 16px 12px; }
      .form-wrapper { max-width: 560px; padding: 28px 20px; margin: 0 auto; }
      .form-title { font-size: clamp(1.6rem, 8vw, 2rem); }
      .payment-options { gap: 8px 16px; }

    @media (max-width: 380px) {
      .home-service-page { padding: 10px 8px; }
      .form-wrapper { padding: 24px 16px; border-radius: 20px; }
      .form-input { padding: 13px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    }

    /* Fluid type and touch-friendly controls across the full viewport range. */
    .section-badge { font-size: clamp(0.75rem, 0.18vw + 0.7rem, 0.875rem); }
    .section-text { font-size: clamp(1rem, 0.35vw + 0.9rem, 1.125rem); }
    .hero p { font-size: clamp(1rem, 0.5vw + 0.85rem, 1.1875rem); }
    .brand-text strong { font-size: clamp(1.0625rem, 0.35vw + 0.95rem, 1.25rem); }
    .stat-box strong { font-size: clamp(1.5rem, 1vw + 1.15rem, 1.875rem); }
    .service-content h3 { font-size: clamp(1.25rem, 0.6vw + 1.05rem, 1.5rem); }
    .service-content p,
    .service-content > span,
    .about-point strong,
    .about-point p,
    .contact-item p,
    .contact-item a,
    .footer-about p,
    .footer-col a,
    .footer-col li { font-size: clamp(0.875rem, 0.25vw + 0.8rem, 0.9375rem); }
    .btn,
    .nav-call,
    button { min-height: 44px; }

    @media (max-width: 380px) {
      .container { width: calc(100% - 20px); }
      .form-wrapper { padding: 24px 16px; }

      .brand { gap: 8px; min-width: 0; }

      .hero h1 { font-size: clamp(2.25rem, 12vw, 3rem); }
      .section-padding { padding: 64px 0; }
      .about-image img { aspect-ratio: 1 / 1; }
      .traditional-feature { aspect-ratio: 4 / 3; }
      .traditional-feature-overlay { padding: 24px; }
    }

    @media (min-width: 1440px) {
      .container { width: min(1320px, calc(100% - 80px)); }
      .section-padding { padding: clamp(105px, 7vw, 150px) 0; }
      .hero-content { max-width: 820px; }
      .about-image img { aspect-ratio: 16 / 12; }
      .traditional-feature { aspect-ratio: 16 / 7; }
    }

    /* Responsive */
    @media (max-width: 1023px) {
      nav ul {
        position: fixed;
        top: 74px;
        left: 14px;
        right: 14px;
        display: grid;
        gap: 0;
        padding: 18px;
        border-radius: 24px;
        background: rgba(11, 9, 8, 0.98);
        border: 1px solid rgba(212, 175, 55, 0.24);
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.55);
        backdrop-filter: blur(18px);
        transform: translateY(-18px);
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        transition: 0.35s ease;
      }

      nav ul.active {
        transform: translateY(0);
        opacity: 1;
        visibility: visible;
        pointer-events: auto;
      }

      nav ul li a {
        display: flex;
        padding: 14px 16px;
        border-radius: 16px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.951);
      }

      nav ul li:last-child a {
        border-bottom: 0;
      }

      nav ul li a:hover {
        background: rgba(55, 201, 212, 0.12);
      }

<body class="home-service-page">

  <div class="form-wrapper">
    
    <div class="section-header form-header">
      <h2 class="section-title form-title">Book Home Service</h2>
      <p class="section-text form-intro">Fill out the details below and we will reach your location on time.</p>
      
      <!-- Dynamic Service Badge -->
      <div id="selectedServiceBadge" class="service-badge">
        <i class="fa-solid fa-check-circle"></i> Booking: <span id="serviceNameDisplay"></span>
      </div>
    </div>

    <form id="homeServiceForm" class="booking-form">
      
      <!-- Hidden Input for Database -->
      <input type="hidden" id="selectedServiceInput" name="service">
      
      <div class="form-group">
        <label for="name" class="form-label">Full Name</label>
        <input type="text" id="name" name="name" class="form-input" placeholder="Enter your full name" required>
      </div>

      <div class="form-group">
        <label for="age" class="form-label">Age</label>
        <input type="number" id="age" name="age" class="form-input" placeholder="Enter age" min="1" max="120" inputmode="numeric" required>
      </div>
      
      <div class="form-group">
        <label for="number" class="form-label">Phone Number</label>
        <input type="tel" id="number" name="number" class="form-input" placeholder="10-digit mobile number" required>
      </div>
      
      <div class="form-group">
        <label for="address" class="form-label">Complete Address</label>
        <textarea id="address" name="address" class="form-input textarea" placeholder="House/Flat No, Building Name, Street, Area" required rows="3"></textarea>
      </div>

      <div class="form-group">
        <label for="time" class="form-label">Available Time</label>
        <input type="time" id="time" name="time" class="form-input" required>
      </div>

      <div class="form-group">
        <label class="form-label payment-label">Payment Type</label>
        <div class="payment-options">
          <label class="payment-option">
            <input type="radio" name="paymentType" value="Cash" required> Cash
          </label>
          <label class="payment-option">
            <input type="radio" name="paymentType" value="Online"> Online (UPI/QR)
          </label>
        </div>
      </div>

      <button type="submit" class="btn btn-primary submit-button">
        <i class="fa-solid fa-paper-plane"></i> Book Appointment Now
      </button>
      
      <div class="form-back">
        <a href="index.html"><i class="fa-solid fa-arrow-left"></i> Back to Home</a>
      </div>
    </form>
  </div>

  <script>
    // Change this endpoint when the backend is deployed at another URL.
    const BOOKING_API_ENDPOINT = '/api/bookings';

    // Extract service from URL and populate the page
    const urlParams = new URLSearchParams(window.location.search);
    const service = urlParams.get('service');
    
    if (service) {
      document.getElementById('serviceNameDisplay').textContent = service;
      document.getElementById('selectedServiceBadge').style.display = 'inline-block';
      document.getElementById('selectedServiceInput').value = service;
    }

    // Handle form submission
    const form = document.getElementById('homeServiceForm');
    form.addEventListener('submit', async (e) => {
      e.preventDefault(); // Prevent default page reload

      // Gather data
      const formData = new FormData(form);
      const data = Object.fromEntries(formData.entries());
      
      // Basic validation
      if (!data.service) {
        data.service = "General Home Service"; // Default if not clicked through a specific link
      }

      // Change button text while loading
      const btn = form.querySelector('button[type="submit"]');
      const originalText = btn.innerHTML;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Booking...';
      btn.disabled = true;

      try {
        const response = await fetch(BOOKING_API_ENDPOINT, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(data)
        });

        const result = await response.json();

        if (result.success) {
          if (data.paymentType === 'Online') {
            alert('Booking Details Saved! Redirecting you to the Payment section to complete your booking...');
            window.location.href = 'index.html#payment';
          } else {
            alert('Booking Successful! We will contact you shortly to confirm your cash booking.');
            form.reset();
            if (service) document.getElementById('selectedServiceInput').value = service;
          }
        } else {
          alert('Failed to book. Please try again.');
        }
      } catch (error) {
        console.error('Error:', error);
        alert('An error occurred. Make sure the server is running.');
      } finally {
        // Restore button
        btn.innerHTML = originalText;
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
